[package]
name = "passlet-core"
version = "0.1.0"
edition = "2021"
description = "Passlet 的核心逻辑：加密、存储、条目模型、配置。不依赖任何 GUI 框架。"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand = "0.8"
zeroize = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# 读用户/机器级环境变量：setx 只写注册表，运行中的进程环境块不会更新
winreg = "0.52"
# 写完环境变量要广播 WM_SETTINGCHANGE，否则 Explorer 仍用旧的环境块，新开的终端读不到
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
